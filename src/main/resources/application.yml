spring:
  application:
    name: nexacart
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexacart}
    username: ${DB_USER:nexacart}
    password: ${DB_PASSWORD:nexacart_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

nexacart:
  security:
    jwt:
      secret: ${NEXACART_JWT_SECRET:}
      issuer: ${NEXACART_JWT_ISSUER:nexacart}
      access-token-ttl-seconds: ${NEXACART_JWT_TTL_SECONDS:900}
  cors:
    allowed-origins: ${NEXACART_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  orders:
    shipping-fee: ${NEXACART_SHIPPING_FEE:5.99}
    free-shipping-threshold: ${NEXACART_FREE_SHIPPING_THRESHOLD:100.00}
    currency: ${NEXACART_CURRENCY:USD}
  payments:
    simulator-enabled: ${NEXACART_PAYMENT_SIMULATOR_ENABLED:false}
  rate-limit:
    enabled: ${NEXACART_RATE_LIMIT_ENABLED:true}
    max-attempts: ${NEXACART_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${NEXACART_RATE_LIMIT_WINDOW_SECONDS:60}
  seed:
    enabled: false
    admin-email: ${NEXACART_ADMIN_EMAIL:admin@nexacart.local}
    admin-password: ${NEXACART_ADMIN_PASSWORD:}
    customer-password: ${NEXACART_SEED_CUSTOMER_PASSWORD:}
