services:
  postgres:
    image: postgres:17-alpine
    container_name: nexacart-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexacart}
      POSTGRES_USER: ${POSTGRES_USER:-nexacart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexacart_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nexacart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexacart} -d ${POSTGRES_DB:-nexacart}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexacart-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexacart}
      DB_USER: ${POSTGRES_USER:-nexacart}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexacart_dev_password}
      NEXACART_JWT_SECRET: ${NEXACART_JWT_SECRET:-}
      NEXACART_JWT_ISSUER: ${NEXACART_JWT_ISSUER:-nexacart}
      NEXACART_JWT_TTL_SECONDS: ${NEXACART_JWT_TTL_SECONDS:-900}
      NEXACART_CORS_ALLOWED_ORIGINS: ${NEXACART_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      NEXACART_SHIPPING_FEE: ${NEXACART_SHIPPING_FEE:-5.99}
      NEXACART_FREE_SHIPPING_THRESHOLD: ${NEXACART_FREE_SHIPPING_THRESHOLD:-100.00}
      NEXACART_CURRENCY: ${NEXACART_CURRENCY:-USD}
      NEXACART_PAYMENT_SIMULATOR_ENABLED: ${NEXACART_PAYMENT_SIMULATOR_ENABLED:-true}
      NEXACART_RATE_LIMIT_ENABLED: ${NEXACART_RATE_LIMIT_ENABLED:-true}
      NEXACART_RATE_LIMIT_MAX_ATTEMPTS: ${NEXACART_RATE_LIMIT_MAX_ATTEMPTS:-10}
      NEXACART_RATE_LIMIT_WINDOW_SECONDS: ${NEXACART_RATE_LIMIT_WINDOW_SECONDS:-60}
      NEXACART_SEED_ENABLED: ${NEXACART_SEED_ENABLED:-true}
      NEXACART_SEED_CUSTOMER_PASSWORD: ${NEXACART_SEED_CUSTOMER_PASSWORD:-Customer123!}
      NEXACART_ADMIN_EMAIL: ${NEXACART_ADMIN_EMAIL:-admin@nexacart.local}
      NEXACART_ADMIN_PASSWORD: ${NEXACART_ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

volumes:
  nexacart_pgdata:
